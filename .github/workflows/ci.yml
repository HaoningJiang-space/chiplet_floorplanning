name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -p '*_unittest.py' -v
      - run: chiplet-floorplanning evaluate examples/two_chiplets.json --output results/ci
      - run: chiplet-floorplanning evaluate examples/layered_two_chiplets.json --output results/ci-package
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake tcl-dev zlib1g-dev flex bison swig ngspice verilator
      - run: python -m pip install '.[validation]'
      - run: python tools/bootstrap_validation.py --build-sta --jobs 2
      - run: python tools/validate_package.py --output results/package
      - run: python tools/validate_electrical.py --ngspice /usr/bin/ngspice --output results/electrical
      - run: python tools/validate_characterization.py --output results/characterization
      - run: python tools/validate_prototype.py --output results/prototype
      - run: OPENBLAS_NUM_THREADS=1 python tools/validate_open_thermal.py --output results/open-thermal
      - run: python tools/validate_sta_goldens.py --output results/sta-goldens
      - run: python tools/validate_pulp_phy.py --output results/pulp-phy
      - run: OPENBLAS_NUM_THREADS=1 python tools/validate_layout_ranking.py --output results/ranking
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numerical-validation-evidence
          path: |
            results/
            !results/**/*.lib
            !results/**/obj/**
