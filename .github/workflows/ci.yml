name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -p '*_unittest.py' -v
      - run: chiplet-floorplanning evaluate examples/two_chiplets.json --output results/ci
      - run: chiplet-floorplanning evaluate examples/layered_two_chiplets.json --output results/ci-package
