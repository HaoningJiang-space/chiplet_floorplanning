# Native Windows tools used for the 2026-11-11 reproduction.
# The generated local/build/opensta/build-receipt.json records exact package
# builds/hashes and the executable/patch hashes; this file pins direct versions.
channels:
  - conda-forge
dependencies:
  - gxx_win-64=16.2.0
  - cmake=4.4.5
  - ninja=1.13.2
  - swig=4.5.1
  - winflexbison=2.5.25
  - tk=8.6.13
  - zlib=1.3.2
